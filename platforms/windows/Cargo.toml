[package]
name = "wind-windows"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Windows screenshot and video capture"
rust-version = "1.74"

[dependencies]
png = "0.17"
wind-activity = { path = "../../crates/activity" }
wind-app-tracker = { path = "../../crates/app-tracker" }
wind-core = { path = "../../crates/core" }
wind-screenshot = { path = "../../crates/screenshot" }
wind-storage = { path = "../../crates/storage" }
wind-url-tracker = { path = "../../crates/url-tracker" }
wind-video = { path = "../../crates/video" }
xcap = { version = "0.9.8", default-features = false, features = ["image", "wgc"] }
windows = { version = "0.61", features = [
    "Graphics_Capture",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
unsafe_code = "allow"
