[package]
name = "wind-linux"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Linux screenshot and video capture"
rust-version = "1.85"

[dependencies]
mp4 = "0.14"
openh264 = "0.8"
png = "0.17"
wind-activity = { path = "../../crates/activity" }
wind-app-tracker = { path = "../../crates/app-tracker" }
wind-core = { path = "../../crates/core" }
wind-screenshot = { path = "../../crates/screenshot" }
wind-storage = { path = "../../crates/storage" }
wind-url-tracker = { path = "../../crates/url-tracker" }
wind-video = { path = "../../crates/video" }
x11rb = { version = "0.13", features = ["xinput"] }
zbus = "5"
xcap = { version = "0.9.8", default-features = false, features = ["image"] }

[lints.rust]
unsafe_code = "forbid"
