[package]
name = "wind-macos"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "macOS ScreenCaptureKit screenshot and video provider"
rust-version = "1.85"

[dependencies]
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", features = ["CFRunLoop", "CFMachPort"] }
objc2-core-graphics = { version = "0.3", features = ["CGEvent", "CGEventTypes"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication"] }
png = "0.17"
screencapturekit = { version = "11", features = ["macos_15_0"] }
wind-activity = { path = "../../crates/activity" }
wind-app-tracker = { path = "../../crates/app-tracker" }
wind-core = { path = "../../crates/core" }
wind-screenshot = { path = "../../crates/screenshot" }
wind-storage = { path = "../../crates/storage" }
wind-url-tracker = { path = "../../crates/url-tracker" }
wind-video = { path = "../../crates/video" }

[lints.rust]
unsafe_code = "deny"
